spring.application.name=desafio NTT DATA
# Deixa o Hibernate criar/atualizar as tabelas
spring.jpa.hibernate.ddl-auto=update

# Força execução do data.sql depois do schema estar pronto
#spring.sql.init.data-locations=classpath:db/data.sql
#spring.sql.init.mode=always
#spring.jpa.defer-datasource-initialization=false

# DATABASE CONFIGURATION
spring.datasource.url=jdbc:h2:mem:agenciadb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${USER}
spring.datasource.password=${PASS}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostrar SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# CONFIG URL API EXTERNA
spring.datasource.properties.api_url=${API_URL}

# Logging
logging.level.org.springframework=INFO
# Logging mais verboso no pacote da aplicação
logging.level.evandro.ntt_data.desafio=DEBUG

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always